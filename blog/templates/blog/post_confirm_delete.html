<!DOCTYPE html>
<html>
<head>
    <title>Удаление записи</title>
</head>
<body>
    <h1>Удаление записи</h1>

    <p>Вы уверены, что хотите удалить запись "{{ object.title }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Да, удалить</button>
    </form>

    <a href="{% url 'blog:post_detail' object.pk %}">Отмена</a>
</body>
</html>
